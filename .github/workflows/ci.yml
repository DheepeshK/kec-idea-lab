name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Security audit
        # Gates CI on critical vulnerabilities. High-severity findings on the
        # Next.js 14 line (fixed only in a major upgrade) are tracked separately.
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
